<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elevator Lobby</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="lobby">
      <div class="lobby-floor-plaque" id="lobby-floor-plaque">10</div>
      <div class="lift-wrap" id="lift-left">
        <div class="lift-led">--</div>
        <div class="lift-frame">
          <div class="lift-interior"></div>
          <div class="door door-left"></div>
          <div class="door door-right"></div>
        </div>
      </div>
      <div class="lift-wrap" id="lift-right">
        <div class="lift-led">--</div>
        <div class="lift-frame">
          <div class="lift-interior"></div>
          <div class="door door-left"></div>
          <div class="door door-right"></div>
        </div>
      </div>
      <div class="button" id="button">
        <div class="btn-arrow btn-up" id="btn-up">▲</div>
        <div class="btn-arrow btn-down" id="btn-down">▼</div>
      </div>
      <div class="character" id="character">
        <canvas class="character-canvas" id="character-canvas" width="300" height="480"></canvas>
      </div>
      <div class="click-hint" id="click-hint" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19 L3 7 L21 7 Z" fill="currentColor" />
        </svg>
      </div>
    </div>
    <div class="settings">
      <button class="settings-icon" id="settings-icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <div class="settings-panel" id="settings-panel" hidden>
        <h3>Scheduling Algorithm</h3>
        <p class="settings-intro">Pick how the lobby decides which lift answers your call. Try each and watch the difference.</p>
        <label class="algo-option">
          <input type="radio" name="algo" value="nearest" checked />
          <div>
            <strong>Nearest idle</strong>
            <span class="desc">Closest idle lift wins. Smart default.</span>
          </div>
        </label>
        <label class="algo-option">
          <input type="radio" name="algo" value="random" />
          <div>
            <strong>Random</strong>
            <span class="desc">Any idle lift, purely by chance.</span>
          </div>
        </label>
        <label class="algo-option">
          <input type="radio" name="algo" value="furthest" />
          <div>
            <strong>Furthest idle</strong>
            <span class="desc">Worst possible pick. Feel the wait.</span>
          </div>
        </label>
      </div>
    </div>
    <div class="edit-controls">
      <button id="edit-copy" hidden>Copy Positions</button>
    </div>
    <div id="edit-overlay" hidden></div>
    <script src="https://unpkg.com/@rive-app/canvas@2.17.3"></script>
    <script src="app.js"></script>
  </body>
</html>
